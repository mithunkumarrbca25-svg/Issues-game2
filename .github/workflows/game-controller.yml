name: Issues Game 2 Controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  check-answer:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Process participant answer
        uses: actions/github-script@v7
        env:
          GAME1_ANSWER: ${{ secrets.GAME1_ANSWER }}
          GAME2_ANSWER: ${{ secrets.GAME2_ANSWER }}
          GAME3_ANSWER: ${{ secrets.GAME3_ANSWER }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = context.payload.comment.body.trim();
            const author = context.payload.comment.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const gameIssues = { 1: 4, 2: 5, 3: 6 };
            const issueToGame = { 4: 1, 5: 2, 6: 3 };

            if (!body.toLowerCase().startsWith('/answer ')) return;
            if (!issueToGame[issue.number]) return;

            async function comments(number) {
              return await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: number,
                per_page: 100
              });
            }

            async function hasPass(gameNumber, user) {
              const marker = '<!-- ISSUES-GAME2-PASS game=' + gameNumber + ' user=' + user + ' -->';
              return (await comments(gameIssues[gameNumber])).some(c => c.body.includes(marker));
            }

            const game = issueToGame[issue.number];
            const answers = {
              1: process.env.GAME1_ANSWER,
              2: process.env.GAME2_ANSWER,
              3: process.env.GAME3_ANSWER
            };

            if (!answers[game]) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '⚠️ This game is not configured yet. Please contact the organizer.'
              });
              return;
            }

            if (game === 2 && !(await hasPass(1, author))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '🔒 Game 2 is locked. Complete Game 1 successfully first.'
              });
              return;
            }

            if (game === 3 && !(await hasPass(2, author))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '🔒 Game 3 is locked. Complete Game 2 successfully first.'
              });
              return;
            }

            const supplied = body.slice(8).split(/\r?\n/)[0].trim().toLowerCase();
            const expected = answers[game].trim().toLowerCase();

            if (game === 3) {
              const commitLine = body.split(/\r?\n/).find(line => /^commit\s*:/i.test(line));
              if (!commitLine) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: '❌ Please include a valid line in this format:\n\nCommit: <link to your commit>'
                });
                return;
              }

              const match = commitLine.match(/https:\/\/github\.com\/([^/]+)\/([^/]+)\/commit\/([0-9a-f]{7,40})/i);
              if (!match) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: '❌ The commit link is not valid. Please submit a GitHub commit URL.'
                });
                return;
              }

              const submittedOwner = match[1];
              const submittedRepo = match[2];
              const submittedSha = match[3];

              let commit;
              try {
                commit = await github.rest.repos.getCommit({
                  owner: submittedOwner,
                  repo: submittedRepo,
                  ref: submittedSha
                });
              } catch (error) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: '❌ I could not access that commit. Make sure the repository is public and the link is correct.'
                });
                return;
              }

              const file = (commit.data.files || []).find(f => f.filename === 'final-answer.txt');
              if (!file) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: '❌ The linked commit does not contain `final-answer.txt`.'
                });
                return;
              }
            }

            if (supplied !== expected) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '❌ Not quite, @' + author + '. Please try again.'
              });
              return;
            }

            const marker = '<!-- ISSUES-GAME2-PASS game=' + game + ' user=' + author + ' -->';
            const next = game < 3
              ? '\n\n🔓 Game ' + (game + 1) + ' is now unlocked for you: https://github.com/' + owner + '/' + repo + '/issues/' + gameIssues[game + 1]
              : '\n\n🏆 Event complete! The organizer will manually verify your `final-answer.txt` file.';

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: '✅ Correct, @' + author + '! Game ' + game + ' is complete.\n\n' + marker + next
            });